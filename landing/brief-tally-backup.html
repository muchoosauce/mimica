<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Brief de production — Mimica</title>
<meta name="description" content="Formulaire de brief — réservé clients Mimica.">

<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ─── Design tokens (synced with main landing) ───────────────── */
:root {
  --s-4: 4px; --s-8: 8px; --s-12: 12px; --s-16: 16px; --s-20: 20px;
  --s-24: 24px; --s-32: 32px; --s-40: 40px; --s-48: 48px; --s-64: 64px;
  --s-80: 80px; --s-96: 96px;
  --canvas: #0A0A0F;
  --surface-1: #13131C;
  --surface-2: #1A1A24;
  --surface-3: #20202C;
  --border: rgba(255, 255, 255, 0.08);
  --border-emp: rgba(255, 255, 255, 0.14);
  --text: #F4F4F6;
  --muted: #9999A0;
  --dim: #5C5C66;
  --accent: #7C5CFF;
  --pink: #EC4899;
  --gradient: linear-gradient(135deg, #7C5CFF 0%, #EC4899 100%);
  --r-card: 16px;
  --r-input: 10px;
  --r-pill: 9999px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast: 200ms;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--canvas);
  color: var(--text);
  font-size: 16px;
  line-height: 1.6;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 var(--s-24);
}

/* ─── Page header ─────────────────────────────────────────────── */
.brief-header {
  padding: var(--s-48) 0 var(--s-32);
  text-align: center;
  position: relative;
  overflow: hidden;
}
.brief-header::before {
  content: '';
  position: absolute;
  top: -100px;
  left: 50%;
  transform: translateX(-50%);
  width: 60vw;
  max-width: 700px;
  height: 400px;
  background: radial-gradient(ellipse at center, rgba(124, 92, 255, 0.20) 0%, rgba(236, 72, 153, 0.10) 35%, transparent 70%);
  filter: blur(60px);
  pointer-events: none;
  z-index: 0;
}
.brief-header > * { position: relative; z-index: 1; }
.brief-logo {
  display: inline-flex;
  align-items: center;
  gap: var(--s-8);
  margin-bottom: var(--s-32);
  text-decoration: none;
  color: var(--text);
  font-weight: 600;
}
.brief-logo-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--gradient);
  box-shadow: 0 0 14px rgba(124, 92, 255, 0.55);
}
.eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.brief-title {
  font-size: 40px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin: var(--s-16) 0 var(--s-16);
}
.brief-title .gradient-text {
  background: var(--gradient);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brief-sub {
  font-size: 17px;
  color: var(--muted);
  max-width: 540px;
  margin: 0 auto;
}

/* ─── Form ────────────────────────────────────────────────────── */
.brief-form {
  padding: var(--s-32) 0 var(--s-80);
}
.fieldset {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--r-card);
  padding: var(--s-32);
  margin-bottom: var(--s-20);
  transition: border-color var(--dur-fast) var(--ease);
}
.fieldset:focus-within { border-color: var(--border-emp); }
.legend {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: var(--s-20);
}
.field {
  margin-bottom: var(--s-16);
}
.field:last-child { margin-bottom: 0; }
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s-12);
}
@media (max-width: 560px) {
  .field-row { grid-template-columns: 1fr; }
}
.label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: var(--s-8);
}
.label .req {
  color: var(--accent);
  margin-left: 2px;
}
.hint {
  font-size: 12px;
  color: var(--dim);
  margin-top: var(--s-4);
  line-height: 1.4;
}
.input, .textarea, .select {
  width: 100%;
  font: inherit;
  font-size: 15px;
  padding: 11px var(--s-16);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-input);
  color: var(--text);
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
  outline: none;
}
.input:focus, .textarea:focus, .select:focus {
  border-color: var(--accent);
  background: var(--surface-3);
}
.input::placeholder, .textarea::placeholder { color: var(--dim); }
.textarea {
  resize: vertical;
  min-height: 96px;
  line-height: 1.5;
  font-family: inherit;
}
.select {
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239999a0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 16px;
  padding-right: var(--s-40);
  cursor: pointer;
}

/* Radio + checkbox groups */
.choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s-8);
}
@media (max-width: 560px) {
  .choice-grid { grid-template-columns: 1fr; }
}
.choice {
  display: flex;
  align-items: center;
  gap: var(--s-12);
  padding: var(--s-12) var(--s-16);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-input);
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
  user-select: none;
  font-size: 14px;
}
.choice:hover { border-color: var(--border-emp); }
.choice input { accent-color: #7C5CFF; }
.choice input:checked ~ .choice-text { color: var(--text); font-weight: 500; }
.choice:has(input:checked) {
  border-color: var(--accent);
  background: rgba(124, 92, 255, 0.08);
}
.choice-text { color: var(--muted); transition: color var(--dur-fast) var(--ease); }

/* CTA */
.submit-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: var(--s-32);
  gap: var(--s-16);
  flex-wrap: wrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--s-8);
  padding: 14px var(--s-32);
  border: none;
  border-radius: var(--r-pill);
  font-size: 15px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  background: var(--gradient);
  color: #fff;
  box-shadow: 0 4px 16px rgba(124, 92, 255, 0.25);
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(124, 92, 255, 0.4);
}
.btn:active { transform: translateY(0); }
.btn-arrow { transition: transform var(--dur-fast) var(--ease); }
.btn:hover .btn-arrow { transform: translateX(3px); }
.submit-note {
  font-size: 12px;
  color: var(--dim);
  max-width: 280px;
}

/* Success state */
.success-card {
  display: none;
  text-align: center;
  padding: var(--s-48) var(--s-32);
  background: var(--surface-1);
  border: 1px solid rgba(74, 222, 128, 0.3);
  border-radius: var(--r-card);
  margin-bottom: var(--s-20);
}
.success-card.is-visible { display: block; }
.success-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto var(--s-16);
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(74, 222, 128, 0.15);
  border-radius: 50%;
  color: #4ADE80;
  font-size: 28px;
  font-weight: 700;
}
.success-title {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: var(--s-8);
}
.success-desc {
  font-size: 15px;
  color: var(--muted);
  max-width: 420px;
  margin: 0 auto;
}

/* Footer */
.brief-footer {
  text-align: center;
  padding: var(--s-32) 0 var(--s-48);
  color: var(--dim);
  font-size: 13px;
  border-top: 1px solid var(--border);
}
.brief-footer a { color: var(--muted); text-decoration: none; }
.brief-footer a:hover { color: var(--text); }

/* Mobile tweaks */
@media (max-width: 640px) {
  .brief-title { font-size: 30px; }
  .fieldset { padding: var(--s-24); }
}

/* ─── Tally iframe wrapper ────────────────────────────────────── */
.tally-wrap {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--r-card);
  padding: var(--s-32);
  margin-bottom: var(--s-20);
  transition: border-color var(--dur-fast) var(--ease);
}
.tally-wrap:focus-within { border-color: var(--border-emp); }
.tally-wrap iframe {
  width: 100%;
  border: 0;
  display: block;
  min-height: 600px;
  background: transparent;
}
@media (max-width: 640px) {
  .tally-wrap { padding: var(--s-16); }
}
</style>
</head>
<body>

<header class="brief-header">
  <div class="container">
    <a href="/" class="brief-logo">
      <span class="brief-logo-dot"></span>
      mimica
    </a>
    <span class="eyebrow">Brief client</span>
    <h1 class="brief-title">Brief de <span class="gradient-text">production</span></h1>
    <p class="brief-sub">Envoyez les éléments nécessaires pour qu'on produise votre prochain batch de variantes. Premier batch sous 72h après réception.</p>
  </div>
</header>

<main class="brief-form">
  <div class="container">
    <div class="tally-wrap">
      <iframe
        data-tally-src="https://tally.so/embed/QKzdDA?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
        loading="lazy"
        width="100%"
        height="600"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
        title="Brief client Mimica"></iframe>
    </div>
  </div>
</main>

<script>
// Tally embed loader (auto-resize, lazy load)
var d=document,w="https://tally.so/widgets/embed.js",v=function(){"undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function(e){e.src=e.dataset.tallySrc})};
if("undefined"!=typeof Tally){v();}else if(d.querySelector('script[src="'+w+'"]')==null){var s=d.createElement("script");s.src=w;s.onload=v;s.onerror=v;d.body.appendChild(s);}
</script>

<footer class="brief-footer">
  <div class="container">
    <p>© 2026 Mimica · <a href="/">mimica.fr</a> · <a href="mailto:contact@mimica.fr">contact@mimica.fr</a></p>
  </div>
</footer>

<script>
(() => {
  const form = document.getElementById('briefForm');
  const success = document.getElementById('successCard');

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    // Basic validation
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    const fd = new FormData(form);
    const get = (n) => fd.get(n) || '—';
    const getAll = (n) => fd.getAll(n).join(', ') || '—';

    const subject = `[Brief Mimica] ${get('brand_name')} — ${get('service')}`;

    const body = `BRIEF MIMICA
═══════════════════════════════

▸ VOUS & VOTRE MARQUE
  Nom         : ${get('contact_name')}
  Email       : ${get('contact_email')}
  Marque      : ${get('brand_name')}
  Site web    : ${get('brand_website')}

▸ TYPE DE PRODUCTION
  ${get('service')}

▸ SOURCE(S)
  Lien(s) :
  ${get('source_links')}

  Contexte :
  ${get('source_context')}

▸ AXES À EXPLORER
  Axes      : ${getAll('axes')}
  Précisions :
  ${get('axes_notes')}

▸ FORMAT & VOLUME
  Formats : ${getAll('formats')}
  Volume  : ${get('volume')}

▸ CONTRAINTES BRAND
  No-go      :
  ${get('no_go')}

  Must-have  :
  ${get('must_have')}

▸ DÉLAI
  ${get('deadline')}
  Date butoir : ${get('deadline_date')}

▸ NOTES LIBRES
  ${get('notes')}

═══════════════════════════════
Envoyé via mimica.fr/brief
`;

    const mailto = `mailto:contact@mimica.fr?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

    // Open mail client
    window.location.href = mailto;

    // Show success state
    success.classList.add('is-visible');
    success.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
})();
</script>

</body>
</html>
